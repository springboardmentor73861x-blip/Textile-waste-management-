version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: textile_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-textile_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-textile_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-textile_waste_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-textile_user} -d ${POSTGRES_DB:-textile_waste_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: textile_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-textile_user}:${POSTGRES_PASSWORD:-textile_pass_123}@postgres:5432/${POSTGRES_DB:-textile_waste_db}
      SECRET_KEY: ${SECRET_KEY:-super_secret_jwt_key_2026}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: textile_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: textile_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
